title: AB//LABS Quarto theme
description: A shared look for our Quarto websites, as a format extension.
author: AB//LABS
version: 1.1.0
quarto-required: ">=1.10.0"
contributes:
  formats:
    html:
      theme:
        light: [flatly, theme.scss]
        dark: [darkly, theme-dark.scss]
      format-resources:
        - repo-stats.js
        - library-search.js
        - minisearch.min.js
      grid:
        sidebar-width: 270px
        body-width: 820px
        margin-width: 230px
        gutter-width: 1.5rem
      toc: true
      link-external-icon: false
      link-external-newwindow: false
      smooth-scroll: true
