site_name: AI-Enhanced OSINT
site_description: A practical guide for illicit trade intelligence, by Atlas Bear Labs
site_url: https://atlas-bear.github.io/osint-ai-guide/
repo_url: https://github.com/atlas-bear/osint-ai-guide
repo_name: atlas-bear/osint-ai-guide
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025-2026 Atlas Bear. Text licensed CC BY 4.0.

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Start here: index.md
  - "Part 1: The OPSEC rubric": 01-opsec-rubric.md
  - "Part 2: AI assistants": 02-ai-assistants.md
  - "Part 3: Local and open-weight models": 03-local-models.md
  - "Part 4: AI-agent security": 04-agent-security.md
  - "Part 5: OPSEC": 05-opsec.md
  - "Part 6: Analytic tradecraft": 06-tradecraft.md
  - "Part 7: Synthetic media and geolocation": 07-synthetic-media.md
  - "Part 8: Adversarial use of AI": 08-adversarial-ai.md
  - "Part 9: Platforms and data sources": 09-platforms-and-data.md
  - "Part 10: Automation and coding": 10-automation.md
  - "Part 11: Legal changes": 11-legal.md
  - "Part 12: For educators": 12-educators.md
  - "Part 13: Investigation workflow": 13-workflow.md
  - Conclusion: conclusion.md
  - "Appendix A: Renamed or discontinued": appendix-a.md
  - About, licence and contact: about.md
  - References: references.md
  - Atlas Bear Library: https://atlas-bear.github.io/

extra:
  social:
    - icon: material/home
      link: https://atlas-bear.github.io/
      name: Atlas Bear Library
    - icon: material/github
      link: https://github.com/atlas-bear
      name: Atlas Bear Labs on GitHub

markdown_extensions:
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

plugins:
  - search
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

hooks:
  - scripts/mkdocs_hooks.py

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

strict: true
